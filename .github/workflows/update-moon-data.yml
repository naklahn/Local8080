name: Update moon data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *" # Daily at 00:17 UTC

permissions:
  contents: write

jobs:
  update-moon-data:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch NASA moon data
        run: node scripts/update-moon-data.mjs

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add moon-data.json
          git diff --cached --quiet || git commit -m "Update moon data"
          git push
